<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index,follow" />

  <title>Christopher Bonetto | Resume</title>
  <meta name="description" content="Christopher Bonetto's current resume." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Christopher Bonetto | Resume" />
  <meta property="og:description" content="Current resume." />
  <meta property="og:url" content="https://christopherbonetto.github.io/cv/" />
  <meta property="og:image" content="https://christopherbonetto.github.io/cv/resume-banner.png" />
  <meta property="og:image:alt" content="Christopher Bonetto - Software Engineer resume banner" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Christopher Bonetto | Resume" />
  <meta name="twitter:description" content="Current resume." />
  <meta name="twitter:image" content="https://christopherbonetto.github.io/cv/resume-banner.png" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #08111a;
      --panel: #0d1b29;
      --border: rgba(255,255,255,.08);
      --accent: #4f9cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #08111a 0%, #0a1520 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 8px 0 28px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    .banner-wrap {
      position: relative;
    }

    .banner {
      display: block;
      width: 100%;
      height: auto;
    }

    .download-button {
      position: absolute;
      left: 44.5%;
      top: 83%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      background: var(--accent);
      color: #06111c;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
      transition: transform .15s ease, filter .15s ease;
    }

    .download-button:hover {
      transform: translate(-50%, -52%);
      filter: brightness(1.05);
    }

    .viewer {
      display: block;
      width: 100%;
      height: calc(100vh - 185px);
      min-height: 680px;
      border: 0;
      border-top: 1px solid var(--border);
      background: white;
    }

    @media (max-width: 720px) {
      .wrap {
        width: min(100% - 12px, 1180px);
        padding-top: 6px;
      }

      .card {
        border-radius: 12px;
      }

      .download-button {
        left: 48%;
        top: 82%;
        min-height: 34px;
        padding: 0 10px;
        border-radius: 8px;
        font-size: .75rem;
      }

      .viewer {
        height: 78vh;
        min-height: 560px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="banner-wrap">
        <img class="banner" src="resume-banner.png" alt="Christopher Bonetto - Software Engineer resume banner" />
        <a class="download-button" href="https://docs.google.com/document/d/1o_6KmcrfAvrHSskuKZcNn9J--DueEE6SsPsilRMWyvA/export?format=pdf&amp;tab=default" target="_blank" rel="noopener noreferrer">Download PDF</a>
      </div>

      <iframe class="viewer" src="https://docs.google.com/document/d/1o_6KmcrfAvrHSskuKZcNn9J--DueEE6SsPsilRMWyvA/preview?tab=default" title="Christopher Bonetto Resume"></iframe>
    </section>
  </main>
</body>
</html>
