<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christopher Bonetto | Resume Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111a;
      --panel: #0d1b29;
      --text: #f5f7fa;
      --muted: #9fb0c0;
      --accent: #4f9cff;
      --border: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #08111a 0%, #0a1520 100%);
      color: var(--text);
    }
    .wrap {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 12px 0 28px;
    }
    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    .banner {
      display: block;
      width: 100%;
      height: auto;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .label {
      font-size: .9rem;
      color: var(--muted);
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      background: var(--accent);
      color: #06111c;
    }
    .viewer {
      width: 100%;
      height: calc(100vh - 260px);
      min-height: 680px;
      border: 0;
      background: white;
    }
    @media (max-width: 720px) {
      .wrap { width: min(100% - 12px, 1180px); padding-top: 6px; }
      .card { border-radius: 12px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .button { width: 100%; }
      .viewer { height: 75vh; min-height: 560px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <img class="banner" src="resume-banner.png" alt="Christopher Bonetto - Software Engineer resume banner" />
      <div class="toolbar">
        <span class="label">Resume preview</span>
        <a class="button" href="https://docs.google.com/document/d/1o_6KmcrfAvrHSskuKZcNn9J--DueEE6SsPsilRMWyvA/export?format=pdf&amp;tab=default" target="_blank" rel="noopener noreferrer">Download PDF</a>
      </div>
      <iframe class="viewer" src="https://docs.google.com/document/d/1o_6KmcrfAvrHSskuKZcNn9J--DueEE6SsPsilRMWyvA/preview?tab=default" title="Christopher Bonetto Resume"></iframe>
    </section>
  </main>
</body>
</html>
