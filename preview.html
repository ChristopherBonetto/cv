<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christopher Bonetto | Resume Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111a;
      --panel: #0d1b29;
      --border: rgba(255,255,255,.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #08111a 0%, #0a1520 100%);
    }

    .wrap {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 8px 0 28px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    .banner {
      display: block;
      width: 100%;
      height: auto;
    }

    .viewer {
      display: block;
      width: 100%;
      height: calc(100vh - 185px);
      min-height: 680px;
      border: 0;
      border-top: 1px solid var(--border);
      background: white;
    }

    @media (max-width: 720px) {
      .wrap {
        width: min(100% - 12px, 1180px);
        padding-top: 6px;
      }

      .card {
        border-radius: 12px;
      }

      .viewer {
        height: 78vh;
        min-height: 560px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <img class="banner" src="resume-banner.png" alt="Christopher Bonetto - Software Engineer resume banner" />
      <iframe class="viewer" src="https://docs.google.com/document/d/1o_6KmcrfAvrHSskuKZcNn9J--DueEE6SsPsilRMWyvA/preview?tab=default" title="Christopher Bonetto Resume"></iframe>
    </section>
  </main>
</body>
</html>
